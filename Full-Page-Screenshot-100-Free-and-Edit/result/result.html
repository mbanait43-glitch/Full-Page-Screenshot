<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Page Screenshot — 100% Free &amp; Edit</title>
  <link rel="stylesheet" href="result.css">
</head>
<body>
  <div class="result-layout">
    <!-- Top Dark Professional Toolbar (Visual structure matching reference image) -->
    <header class="result-header">
      <div class="header-left">
        <a href="../history/history.html" class="brand-link" title="Full Page Screenshot — 100% Free &amp; Edit - View History">
          <svg class="brand-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
          <span class="brand-name">Full Page Screenshot — 100% Free &amp; Edit</span>
        </a>
      </div>

      <div class="header-right">
        <!-- Edit Button -->
        <button id="btnEdit" class="toolbar-btn btn-edit" title="Edit Screenshot (Ctrl+E)">
          Edit
        </button>

        <!-- Delete Button -->
        <button id="btnDelete" class="toolbar-icon-btn" title="Delete Screenshot">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>

        <!-- Save PDF Button -->
        <button id="btnDownloadPDF" class="toolbar-icon-btn btn-pdf" title="Save PDF As...">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <text x="6" y="16.5" font-size="5.5" font-weight="bold" fill="currentColor" stroke="none">PDF</text>
          </svg>
        </button>

        <!-- Save Image Button (with format dropdown) -->
        <div class="dropdown-wrapper">
          <button id="btnDownloadPNG" class="toolbar-icon-btn" title="Download Image (PNG)">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
          </button>
          <button id="btnDownloadDropdown" class="dropdown-arrow-btn" title="More image formats">▾</button>
          <div id="downloadMenu" class="dropdown-menu">
            <button id="menuDownloadPNG" class="menu-item">Save as PNG (Lossless)</button>
            <button id="menuDownloadJPG" class="menu-item">Save as JPG (Compressed)</button>
            <div class="menu-divider"></div>
            <button id="menuDownloadPDFA4" class="menu-item">Save as Paginated A4 PDF</button>
            <button id="menuDownloadPDFContinuous" class="menu-item">Save as Continuous PDF</button>
          </div>
        </div>

        <!-- Copy Image Button -->
        <button id="btnCopy" class="toolbar-icon-btn" title="Copy Image to Clipboard (Ctrl+C)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>

        <!-- History Button -->
        <a id="btnHistory" href="../history/history.html" class="toolbar-icon-btn" title="Screenshot History">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </a>

        <!-- Settings / Options Button -->
        <a id="btnOptions" href="../options/options.html" class="toolbar-icon-btn" title="Settings / Options" target="_blank">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </a>
      </div>
    </header>

    <!-- Main Light/Neutral Gray Workspace (Centered Long Screenshot) -->
    <main id="viewportContainer" class="viewport-workspace">
      <div id="imageStage" class="image-stage">
        <img id="previewImage" class="preview-image" alt="Captured webpage screenshot" title="Click to toggle full size (100%)" />
      </div>
      <div id="emptyState" class="empty-state" style="display: none;">
        <p>No screenshot available</p>
        <a href="../history/history.html" class="toolbar-btn btn-edit" style="margin-top: 12px; display: inline-block;">Go to History</a>
      </div>
    </main>

    <!-- Floating Zoom Controls Bar (Fit / Zoom In / Zoom Out) -->
    <div id="zoomControls" class="zoom-controls-bar">
      <button id="zoomOutBtn" class="zoom-btn" title="Zoom Out (Ctrl+Minus)">−</button>
      <button id="zoomFitBtn" class="zoom-btn zoom-fit-btn" title="Fit to View">Fit</button>
      <button id="zoomInBtn" class="zoom-btn" title="Zoom In (Ctrl+Plus)">+</button>
    </div>

    <!-- Custom Right-Click Context Menu -->
    <div id="screenshotContextMenu" class="screenshot-context-menu" style="display: none;">
      <div class="ctx-item" id="ctxSaveImage">
        <span class="ctx-label">Save Image As...</span>
        <span class="ctx-hint">Ctrl+S</span>
      </div>
      <div class="ctx-item" id="ctxSavePDF">
        <span class="ctx-label">Save PDF As...</span>
      </div>
      <div class="ctx-item" id="ctxCopyImage">
        <span class="ctx-label">Copy Image</span>
        <span class="ctx-hint">Ctrl+C</span>
      </div>
      <div class="ctx-item" id="ctxEditImage">
        <span class="ctx-label">Edit Image</span>
        <span class="ctx-hint">Ctrl+E</span>
      </div>
      <div class="ctx-divider"></div>
      <div class="ctx-item" id="ctxCopyUrl">
        <span class="ctx-label">Copy Original URL</span>
      </div>
      <div class="ctx-item" id="ctxOpenUrl">
        <span class="ctx-label">Open Original URL</span>
      </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast"></div>
  </div>

  <script type="module" src="result.js"></script>
</body>
</html>
